# ohmyoled config — TOML form. Same shape as ohmyoled.json.
# Multi-instance sections (weather/stock/sport) use [[array of tables]].

[matrix_options]
chain_length = 1
parallel = 1
brightness = 50
oled_slowdown = 3
fail_on_error = false
hardware_mapping = "adafruit-hat"  # adafruit-hat | adafruit-hat-pwm | regular | regular-pi1 | classic | classic-pi1

[time]
run = true
color = [255, 255, 255]
time_format = "12h"           # "12h" | "24h"
timezone = "America/New_York"

[[weather]]
run = true
api = "openweather"           # openweather | nws | accuweather | pirate
api_key = "YOUR_OPENWEATHER_KEY"
current_location = true
current_location_api_key = "YOUR_IPINFO_TOKEN"
weather_format = "imperial"   # imperial | metric
animation = "subtle"          # off | subtle | prominent

[[stock]]
run = true
api = "finnhub"               # finnhub (equities) | coingecko (crypto, no key)
api_key = "YOUR_FINNHUB_KEY"
symbol = "AAPL"
# chart = true adds a historical 1D/1M/1Y line graph tile in addition
# to the live price tile. Finnhub configs source the chart from Yahoo
# Finance (Finnhub's /candle is paid-only); coingecko configs source
# it from coingecko's own market_chart endpoint.
chart = true

[[stock]]
run = true
api = "finnhub"
api_key = "YOUR_FINNHUB_KEY"
symbol = "MSFT"

# Crypto entries reuse the stock renderer. `symbol` carries the CoinGecko
# coin id (lowercase, e.g. "bitcoin"); the display ticker is pulled from
# the API response. `api_key` is unused for coingecko's free tier.
[[stock]]
run = true
api = "coingecko"
api_key = "null"
symbol = "bitcoin"

[[stock]]
run = true
api = "coingecko"
api_key = "null"
symbol = "ethereum"

# Pi-hole DNS-block summary — % blocked today, totals.
# `token` is optional ("null" literal = none); the v5 summary endpoint
# works unauthenticated on most home installs.
[pihole]
run = true
base_url = "http://pi.hole"
token = "null"

# Home Assistant entities — multi-instance, one [[hass]] entry per
# entity. Requires a long-lived access token. `alarm_state` (optional)
# flips the state-row color to red on match — useful for doors,
# motion, alarms.
[[hass]]
run = true
base_url = "http://homeassistant.local:8123"
token = "YOUR_HASS_LONG_LIVED_TOKEN"
entity_id = "sensor.kitchen_temp"
label = "KITCHEN"

[[hass]]
run = true
base_url = "http://homeassistant.local:8123"
token = "YOUR_HASS_LONG_LIVED_TOKEN"
entity_id = "binary_sensor.garage_door"
label = "GARAGE"
alarm_state = "open"

# Next upcoming orbital launch via Launch Library 2. Three countdown
# modes by remaining time. `agency_filter` is a case-insensitive
# substring whitelist on the launch provider name — empty = all.
[launch]
run = true
agency_filter = []           # e.g. ["SpaceX", "Rocket Lab"]

# Aircraft within a configurable radius via OpenSky Network. Shows count
# of nearby planes plus the closest one's callsign, altitude (FLnnn),
# distance, and bearing. `lat`/`lon` decimal degrees; `radius_km` 1..500
# — larger = larger bbox = more credits per request.
[flights]
run = true
lat = 40.7128
lon = -74.0060
radius_km = 80

# NOAA planetary K-index — a single big digit (0–9) color-coded green
# (quiet) through red (severe storm), with a 9-block scale bar. An
# "AURORA LIKELY" banner appears when Kp meets/exceeds alert_threshold
# (default 5, NOAA's G1 minor-storm threshold).
[aurora]
run = true
alert_threshold = 5

# Top-magnitude earthquake from the USGS feed in the last 24h, or a
# "QUIET / no events 24h" tile when the feed is empty. `feed` picks the
# window: significant_day (default — alert-worthy only), m45_day,
# m25_day, or all_day (very chatty).
[quake]
run = true
feed = "significant_day"

# Live distance from your location to the International Space Station.
# Switches to an OVERHEAD banner when the ISS is inside your visibility
# footprint. `lat`/`lon` are decimal degrees. Both required — no IP
# fallback for this module.
[iss]
run = true
lat = 40.7128
lon = -74.0060

# Team sports + golf + F1 all live under [[sport]]. Each entry is
# discriminated by its `sport` field. Team sports require `team_logo`;
# golf takes an optional `tour`; F1 takes nothing extra.
[[sport]]
run = true
sport = "basketball"

[sport.team_logo]
name = "Boston Celtics"
sportsdb_leagueid = 4387
url = "https://www.thesportsdb.com/images/media/team/badge/...png"
sport = "basketball"
shorthand = "BOS"
apisportsid = 133
sportsdbid = 134860
sportsipyid = 0

[[sport]]
run = true
sport = "hockey"

[sport.team_logo]
name = "Boston Bruins"
sportsdb_leagueid = 4380
url = "https://www.thesportsdb.com/images/media/team/badge/...png"
sport = "hockey"
shorthand = "BOS"
apisportsid = 673
sportsdbid = 134830
sportsipyid = 0

[[sport]]
run = true
sport = "golf"
tour = "pga"                  # pga | lpga | champions | korn | liv

[[sport]]
run = true
sport = "f1"
