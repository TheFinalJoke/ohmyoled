# ohmyoled config — YAML form. Same shape as ohmyoled.json.
# Sections that accept multiple instances (weather/stock/sport) are lists.
#
# Every section also accepts an optional `cache_ttl_secs: <int>` that
# controls how often a background tokio task re-polls the upstream API:
#   - omit (default): use the collector's built-in refresh_interval
#   - any positive integer: poll every <int> seconds
#   - 0: disable the background task; poll inline on every render
#        (always fresh; the panel briefly stalls during the round-trip)

matrix_options:
  chain_length: 1
  parallel: 1
  brightness: 50
  oled_slowdown: 3
  fail_on_error: false
  hardware_mapping: "adafruit-hat"   # adafruit-hat | adafruit-hat-pwm | regular | regular-pi1 | classic | classic-pi1

time:
  run: true
  color: [255, 255, 255]
  time_format: "12h"        # "12h" | "24h"
  timezone: "America/New_York"

weather:
  - run: true
    api: openweather        # openweather | nws | accuweather | pirate
    api_key: YOUR_OPENWEATHER_KEY
    current_location: true
    current_location_api_key: YOUR_IPINFO_TOKEN
    weather_format: imperial  # imperial | metric
    animation: subtle         # off | subtle | prominent

stock:
  - run: true
    api: finnhub             # finnhub (equities) | coingecko (crypto, no key)
    api_key: YOUR_FINNHUB_KEY
    symbol: AAPL
    # chart: true adds a historical 1D/1M/1Y line graph tile in
    # addition to the live price tile. Finnhub configs source the
    # chart from Yahoo Finance (Finnhub's /candle is paid-only);
    # coingecko configs source it from coingecko's market_chart.
    chart: true
    cache_ttl_secs: 0         # opt out of caching: poll on every render
  - run: true
    api: finnhub
    api_key: YOUR_FINNHUB_KEY
    symbol: MSFT
    # no cache_ttl_secs → use collector default (30 s for live equities)
  # Crypto entries reuse the stock renderer. `symbol` carries the
  # CoinGecko coin id (lowercase, e.g. "bitcoin", "ethereum"); the
  # display ticker is pulled from the API response. `api_key` is unused
  # for coingecko's free tier — set to null to skip.
  - run: true
    api: coingecko
    api_key: null
    symbol: bitcoin
  - run: true
    api: coingecko
    api_key: null
    symbol: ethereum

# Pi-hole DNS-block summary — % blocked today, total queries, blocked.
# `token` is optional: many home installs expose summary stats without
# auth. Supply the v5 admin token (Settings → API/Web interface → Show
# API token) only if your install has API access locked down.
pihole:
  run: true
  base_url: http://pi.hole
  token: null

# Home Assistant entities — display any HASS sensor/state on the panel.
# Multi-instance: one rotation entry per entity. Requires a long-lived
# access token (Profile → Security → Long-Lived Access Tokens in HASS).
# `alarm_state` (optional) flips the state-row color to red when the
# current state matches — useful for door-open / motion-detected /
# alarm-tripped flagging.
hass:
  - run: true
    base_url: http://homeassistant.local:8123
    token: YOUR_HASS_LONG_LIVED_TOKEN
    entity_id: sensor.kitchen_temp
    label: KITCHEN
  - run: true
    base_url: http://homeassistant.local:8123
    token: YOUR_HASS_LONG_LIVED_TOKEN
    entity_id: binary_sensor.garage_door
    label: GARAGE
    alarm_state: open

# Next upcoming orbital launch via Launch Library 2. Three countdown
# modes: T-far ("T-2d 14h"), T-near ("T-03:42:11"), and T-imminent
# ("T-00:00:08", red flashing). `agency_filter` is a case-insensitive
# substring whitelist on the launch provider name — leave empty for
# every upcoming launch worldwide.
launch:
  run: true
  agency_filter: []         # e.g. ["SpaceX", "Rocket Lab"] to narrow

# Aircraft within a configurable radius via OpenSky Network. Shows count
# of nearby planes plus the closest one's callsign, altitude (FLnnn),
# distance, and bearing. `lat`/`lon` in decimal degrees; `radius_km`
# 1..500 — larger radius = larger bbox query, more credits against
# OpenSky's anonymous tier.
flights:
  run: true
  lat: 40.7128
  lon: -74.0060
  radius_km: 80

# NOAA planetary K-index — a single big digit (0–9) color-coded green
# (quiet) through red (severe storm), with a 9-block scale bar. An
# "AURORA LIKELY" banner appears when Kp meets/exceeds alert_threshold
# (default 5, NOAA's G1 minor-storm threshold).
aurora:
  run: true
  alert_threshold: 5

# Top-magnitude earthquake from the USGS feed in the last 24h, or a
# "QUIET / no events 24h" tile when the feed is empty. `feed` picks the
# window: significant_day (default — alert-worthy only), m45_day,
# m25_day, or all_day (very chatty).
quake:
  run: true
  feed: significant_day

# Live distance from your location to the International Space Station.
# Switches to an OVERHEAD banner when the ISS is inside your visibility
# footprint. `lat`/`lon` are decimal degrees (e.g. New York 40.7128,
# -74.0060). Both are required — no IP-based lookup for this module.
iss:
  run: true
  lat: 40.7128
  lon: -74.0060
  cache_ttl_secs: 30           # poll wheretheiss.at every 30 s

# Team sports + golf + F1 all live under `sport`. Each entry is
# discriminated by its `sport:` field. Team sports require `team_logo`;
# golf takes an optional `tour`; F1 takes nothing extra.
sport:
  - run: true
    sport: basketball
    team_logo:
      name: Boston Celtics
      sportsdb_leagueid: 4387
      url: https://www.thesportsdb.com/images/media/team/badge/...png
      sport: basketball
      shorthand: BOS
      apisportsid: 133
      sportsdbid: 134860
      sportsipyid: 0
  - run: true
    sport: hockey
    team_logo:
      name: Boston Bruins
      sportsdb_leagueid: 4380
      url: https://www.thesportsdb.com/images/media/team/badge/...png
      sport: hockey
      shorthand: BOS
      apisportsid: 673
      sportsdbid: 134830
      sportsipyid: 0
  - run: true
    sport: golf
    tour: pga                 # pga | lpga | champions | korn | liv
  - run: true
    sport: f1

# ── E-paper (e-ink) display — independent, opt-in ────────────────────
# Drives a Waveshare B/W e-paper HAT instead of the LED matrix when
# enabled. Same data collectors, but its own separately-tuned tile
# selection rendered as one large static screen. Flip enabled: true and
# set your panel model to switch the process to the e-paper output.
eink:
  enabled: false
  model: "7in5_v2"            # 7in5_v2 (800x480, recommended) | 4in2 | 2in13 | ...
  rotation: 0
  threshold: 128              # luma cut for black/white (0–255)
  # width: 800                # optional: set BOTH to override the model's
  # height: 480               # native resolution (unlisted/custom panels)
  mode: auto                  # auto (hardware on a Pi, else terminal) | terminal | hardware
  emulate: false              # terminal preview only: mimic the slow hardware full-refresh flash
  refresh_ms: 2500            # emulated full-refresh duration (ms) when emulate: true
  # ↑ all three are overridden by OHMYOLED_EINK_MODE / _EMULATE / _REFRESH_MS at runtime
  modules:                    # this display's own content (its own RegistryConfig)
    time:                     # the e-paper display rotates through its tiles
      run: true
      color: [255, 255, 255]  # ignored on B/W; kept for config parity
      time_format: "12h"
    weather:
      run: true
      api: nws                # same providers as the LED weather tile
      current_location: true
      weather_format: imperial
