[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ohmyoled-matrix"
version = "0.1.0"
description = "Python bindings for the ohmyoled LED matrix library"
requires-python = ">=3.10"

[tool.maturin]
python-source = "python"
module-name = "ohmyoled_matrix._ohmyoled_matrix"
features = []
