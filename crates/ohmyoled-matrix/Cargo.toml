[package]
name = "ohmyoled-matrix"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-2.0"
description = "LED matrix abstraction with terminal test mode and RPi hardware backend"

[features]
# hardware feature pulls in the rpi-led-panel driver. Disabled on non-Pi builds.
default = ["hardware"]
hardware = ["dep:rpi-led-panel"]

[dependencies]
log = "0.4"
image = "0.25"
ab_glyph = "0.2"
rpi-led-panel = { version = "0.8", optional = true }

[dev-dependencies]
