# cross-rs's default Docker images for the Pi targets are based on
# Ubuntu 16.04 (xenial) and ship gcc 5 — too old for rpi-led-matrix-sys's
# C++ library (newer linkers reject its objects with "File in wrong
# format"). Pin to the `:main` tag, which is Ubuntu 24.04 with a modern
# gcc, and pre-install the C++ cross-toolchain that those images don't
# include by default.

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = [
    "apt-get update && apt-get install --assume-yes g++-aarch64-linux-gnu",
]

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:main"
pre-build = [
    "apt-get update && apt-get install --assume-yes g++-arm-linux-gnueabihf",
]
