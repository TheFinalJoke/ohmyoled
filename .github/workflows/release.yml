name: Release

# Fires on semver-style version tags (v1.2.3) — not on the separate
# fonts-vN tags used for the runtime fonts tarball.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # Cross-compile the binary for the two Raspberry Pi targets people run
  # ohmyoled on. `cross` handles the toolchains via Docker images, so the
  # host runner doesn't need any aarch64/armhf packages installed.
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            artifact: ohmyoled-aarch64
          - target: armv7-unknown-linux-gnueabihf
            artifact: ohmyoled-armv7
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # No font fetch needed — Font::load_ttf is a runtime concern.
      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Stage binary
        run: cp target/${{ matrix.target }}/release/ohmyoled ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Run a native build of the just-tagged commit and use the binary itself
  # to emit the starter config. Keeps the JSON in lockstep with the
  # `default_config()` Rust source — no risk of a hand-maintained sample
  # drifting from the code.
  starter:
    name: Generate starter config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build native
        run: cargo build --release

      - name: Generate starter
        run: ./target/release/ohmyoled --init-config ohmyoled-starter.json

      - uses: actions/upload-artifact@v4
        with:
          name: starter
          path: ohmyoled-starter.json

  release:
    name: Publish release
    needs: [build, starter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ohmyoled-aarch64
            dist/ohmyoled-armv7
            dist/ohmyoled-starter.json
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Per-arch Docker images. Single-arch builds with pre-built binaries
  # are ~30x faster than multi-arch QEMU builds — no Rust compilation
  # under emulation. The next job assembles a multi-arch manifest.
  docker:
    name: Docker (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            platform: linux/arm64
            artifact: ohmyoled-aarch64
          - target: armv7-unknown-linux-gnueabihf
            platform: linux/arm/v7
            artifact: ohmyoled-armv7
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Stage binary
        run: mv ${{ matrix.artifact }} ohmyoled && chmod +x ohmyoled

      - name: Compute image name
        id: img
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: prodcontainer_build/Dockerfile.release
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            OHMYOLED_VERSION=${{ github.ref_name }}
          tags: ${{ steps.img.outputs.name }}:${{ github.ref_name }}-${{ matrix.target }}

  # Glue the per-arch images into a single multi-arch manifest that
  # `docker pull ghcr.io/.../ohmyoled:v3.0.0` resolves to the right arch.
  manifest:
    name: Multi-arch manifest
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Compute image name
        id: img
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          IMG="${{ steps.img.outputs.name }}"
          TAG="${{ github.ref_name }}"
          docker buildx imagetools create \
            --tag "$IMG:$TAG" \
            --tag "$IMG:latest" \
            "$IMG:$TAG-aarch64-unknown-linux-gnu" \
            "$IMG:$TAG-armv7-unknown-linux-gnueabihf"
