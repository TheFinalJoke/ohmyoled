name: Release

# Two trigger shapes:
#  - Semver tag (v1.2.3): full release — cross-compiled binaries,
#    starter config, GitHub Release page, versioned Docker images
#    (`:v1.2.3`, `:latest`).
#  - Push to main: rolling `:main` / `:latest` Docker images only;
#    no GitHub Release (releases need unique tags) and no binary
#    artifacts uploaded.
#
# Branch CI (tests, clippy) lives in ci.yml — fires on dev pushes
# and PRs to main.
on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

permissions:
  contents: write

jobs:
  # Cross-compile the binary for the two Raspberry Pi targets people run
  # ohmyoled on. `cross` handles the toolchains via Docker images, so the
  # host runner doesn't need any aarch64/armhf packages installed.
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            artifact: ohmyoled-aarch64
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
            ar: aarch64-linux-gnu-ar
          - target: armv7-unknown-linux-gnueabihf
            artifact: ohmyoled-armv7
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++
            ar: arm-linux-gnueabihf-ar
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # No font fetch needed — Font::load_ttf is a runtime concern.
      # CC/CXX/AR are forwarded into the cross container (via the
      # passthrough block in Cross.toml) so rpi-led-matrix-sys's
      # vendored Makefile builds the C++ library with the cross
      # toolchain instead of the host x86_64 one.
      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          AR: ${{ matrix.ar }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Stage binary
        run: cp target/${{ matrix.target }}/release/ohmyoled ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Run a native build of the just-tagged commit and use the binary itself
  # to emit the starter config. Keeps the JSON in lockstep with the
  # `default_config()` Rust source — no risk of a hand-maintained sample
  # drifting from the code. Only needed for the GitHub Release upload, so
  # skipped on plain `main` pushes.
  starter:
    name: Generate starter config
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # --no-default-features skips the hardware backend (rpi-led-matrix-sys
      # refuses to build on non-Pi targets). --init-config doesn't need it.
      - name: Build native (no hardware feature)
        run: cargo build --release --no-default-features

      - name: Generate starter
        run: ./target/release/ohmyoled --init-config ohmyoled-starter.json

      - uses: actions/upload-artifact@v4
        with:
          name: starter
          path: ohmyoled-starter.json

  release:
    name: Publish release
    # GitHub Releases need a unique tag; only run on semver tag pushes.
    if: github.ref_type == 'tag'
    needs: [build, starter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist/

      # Use the `gh` CLI directly instead of softprops/action-gh-release:
      # the latter's @v2 tag rolled forward to a version that mishandles
      # the default GITHUB_TOKEN and rejects valid tokens as "Bad
      # credentials". `gh release create` ships preinstalled on the
      # runner and authenticates straightforwardly via GH_TOKEN.
      # --repo is required because this job has no checkout step; without
      # it `gh` falls back to `git remote` and dies on "not a git repository".
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          test -f dist/ohmyoled-aarch64
          test -f dist/ohmyoled-armv7
          test -f dist/ohmyoled-starter.json
          gh release create "$TAG" \
            --repo "$REPO" \
            --generate-notes \
            dist/ohmyoled-aarch64 \
            dist/ohmyoled-armv7 \
            dist/ohmyoled-starter.json

  # Per-arch Docker images. Single-arch builds with pre-built binaries
  # are ~30x faster than multi-arch QEMU builds — no Rust compilation
  # under emulation. The next job assembles a multi-arch manifest.
  #
  # Pushes to both GHCR (auth via GITHUB_TOKEN) and Docker Hub (auth via
  # the DOCKERHUB_USERNAME + DOCKERHUB_TOKEN repo secrets). If the
  # secrets aren't set the Docker Hub push is skipped — the run still
  # publishes to GHCR.
  docker:
    name: Docker (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            platform: linux/arm64
            artifact: ohmyoled-aarch64
          - target: armv7-unknown-linux-gnueabihf
            platform: linux/arm/v7
            artifact: ohmyoled-armv7
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Stage binary
        run: mv ${{ matrix.artifact }} ohmyoled && chmod +x ohmyoled

      # Tag/branch dispatch — semver tag becomes the image tag verbatim
      # (`v3.6.1-aarch64-…`); pushes to main become `main-aarch64-…`.
      # The manifest job aliases those into `:v3.6.1` + `:latest` (tag)
      # or `:main` + `:latest` (branch).
      - name: Compute image tags
        id: tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          GHCR="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="main"
          fi
          TAG="$VERSION-${{ matrix.target }}"
          TAGS="$GHCR:$TAG"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            TAGS="$TAGS"$'\n'"docker.io/${DOCKERHUB_USERNAME}/ohmyoled:$TAG"
          fi
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: prodcontainer_build/Dockerfile.release
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            OHMYOLED_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}

  # Glue the per-arch images into a multi-arch manifest, on each
  # registry the matrix pushed to.
  manifest:
    name: Multi-arch manifest
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          GHCR="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="main"
          fi
          # GHCR — versioned alias (`:v3.6.1` or `:main`) plus `:latest`.
          # The version alias is stable; `:latest` always points at the
          # most recent push (whether tag or main).
          docker buildx imagetools create \
            --tag "$GHCR:$VERSION" \
            --tag "$GHCR:latest" \
            "$GHCR:$VERSION-aarch64-unknown-linux-gnu" \
            "$GHCR:$VERSION-armv7-unknown-linux-gnueabihf"
          # Docker Hub (only if the secret is set)
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            HUB="docker.io/${DOCKERHUB_USERNAME}/ohmyoled"
            docker buildx imagetools create \
              --tag "$HUB:$VERSION" \
              --tag "$HUB:latest" \
              "$HUB:$VERSION-aarch64-unknown-linux-gnu" \
              "$HUB:$VERSION-armv7-unknown-linux-gnueabihf"
          fi
