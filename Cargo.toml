[workspace]
members = [".", "crates/ohmyoled-matrix"]
resolver = "2"

[package]
name = "ohmyoled"
version = "3.1.0"
edition = "2021"
default-run = "ohmyoled"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["signal", "rt-multi-thread", "macros", "time"] }
thiserror = "2"
libc = "0.2"
image = "0.25"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
async-trait = "0.1"
sunrise = { version = "3", features = ["std"] }
ohmyoled-matrix = { path = "crates/ohmyoled-matrix" }

[lib]
name = "oledlib"
path = "src/lib/lib.rs"

[[bin]]
name = "ohmyoled"
path = "src/main.rs"